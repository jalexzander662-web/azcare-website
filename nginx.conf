server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly. nginx:alpine ships ngx_http_gzip_module;
    # brotli would need a custom build, so gzip only. Already-compressed types
    # (png/jpeg/webp/mp4/woff2) are deliberately excluded — re-zipping wastes CPU.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml application/manifest+json;

    # Hashed Vite build assets are content-addressed and immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static media — cache for a month so repeat visits don't refetch everything.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Never cache the HTML shell, so a new deploy is picked up on the next load
    # instead of the browser serving a stale index.html (the "old version" bug).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA fallback: serve index.html for unknown routes, real files served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
